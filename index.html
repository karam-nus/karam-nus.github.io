<meta name="description" content="Karamjot Singh — AI Research Scientist, Model Optimization. An open knowledge base on language models, vision, object detection, quantization, inference, vectorization, chips and ML engineering.">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap');

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  /* ── red accent (both themes) ── */
  --red:      #cc2222;
  --red-dim:  #7a0f0f;
  --red-deep: #1e0808;
  --red-faint:#110505;
  --track-glow: 0 0 8px rgba(180,20,20,.7), 0 0 22px rgba(130,0,0,.35);

  /* ── dark theme (default) ── */
  --bg:            #0a0a10;
  --bg-panel:      #14141c;
  --text-primary:  #e0e0e0;
  --text-heading:  #e8e8e8;
  --text-link:     #bbbbbb;
  --text-secondary:#888888;
  --text-dim:      #999999;
  --text-muted:    #777777;
  --text-faint:    #666666;
  --border:        #2a2a3a;
  --border-mid:    #333345;
  --border-hover:  #484860;
  --accent:        #dd6666;
  --pill-bg:       #3a2222;
  --pill-text:     #cc9999;
  --pill-border:   #666666;
  --scanline:      rgba(0,0,0,.08);
}

html[data-theme="light"] {
  --bg:            #f5f0e8;
  --bg-panel:      #ede8de;
  --text-primary:  #2c2520;
  --text-heading:  #1e1610;
  --text-link:     #4a3f35;
  --text-secondary:#7a6e62;
  --text-dim:      #8a7e72;
  --text-muted:    #9a8e82;
  --text-faint:    #b0a49a;
  --border:        #c8bfb5;
  --border-mid:    #bab0a6;
  --border-hover:  #a09690;
  --accent:        #b83030;
  --pill-bg:       #edd8cc;
  --pill-text:     #8b3c3c;
  --pill-border:   #c0a898;
  --scanline:      rgba(0,0,0,.03);
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Courier New', monospace;
  min-height: 100vh;
  padding: 56px 28px 100px;
}

/* ── scanline texture overlay ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    var(--scanline) 2px,
    var(--scanline) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

.wrap { max-width: 960px; margin: 0 auto; position: relative; z-index: 1; }

/* ── header ── */
.hdr { text-align: center; margin-bottom: 56px; }
.hdr-name {
  font-size: 26px;
  font-weight: 600;
  color: var(--text-heading);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.hdr-sub {
  font-size: 13px;
  color: var(--text-secondary);
  letter-spacing: .12em;
  text-transform: uppercase;
  line-height: 1.8;
}
.hdr-sub a {
  color: var(--text-secondary);
  text-decoration: none;
  transition: color .2s;
}
.hdr-sub a:hover { color: var(--red); }

/* ── panel ── */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 0;
  padding: 32px 36px;
}

/* ── seg label ── */
.seg-label {
  font-size: 11px;
  letter-spacing: .18em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 16px;
}

/* ── tab grid, one row per category ── */
.seg-wrap { margin-bottom: 40px; }

.seg {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 8px;
}
.seg-row {
  display: grid;
  grid-template-columns: 190px 1fr;
  align-items: baseline;
}
.seg-cat {
  font-size: 10px;
  letter-spacing: .18em;
  color: var(--text-dim);
  text-transform: uppercase;
}
.seg-items {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 28px;
}

.seg-item {
  color: var(--text-secondary);
  font-size: 13px;
  font-family: inherit;
  font-weight: 400;
  padding: 6px 0;
  cursor: pointer;
  position: relative;
  z-index: 1;
  transition: color .15s;
  white-space: nowrap;
  background: none;
  border: none;
  outline: none;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.seg-item:hover { color: var(--text-link); }
.seg-item.active {
  color: var(--text-heading);
  font-weight: 500;
}
.seg-item.draft:not(.active) { color: var(--text-muted); }

.seg-track {
  position: absolute;
  top: 0;
  left: 0;
  height: 2px;
  background: linear-gradient(
    to right,
    transparent,
    var(--red-dim) 20%,
    var(--red) 50%,
    var(--red-dim) 80%,
    transparent
  );
  border-radius: 0;
  box-shadow: var(--track-glow);
  transition:
    left  .22s cubic-bezier(.4,0,.2,1),
    top   .22s cubic-bezier(.4,0,.2,1),
    width .22s cubic-bezier(.4,0,.2,1);
  pointer-events: none;
}

/* ── content panels ── */
.content { display: none; }
.content.active { display: block; }

/* repo meta bar */
.repo-meta {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 18px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-mid);
}
.repo-link {
  font-size: 12px;
  font-family: inherit;
  color: var(--text-secondary);
  text-decoration: none;
  letter-spacing: .14em;
  text-transform: uppercase;
  transition: color .2s;
}
.repo-link:hover { color: var(--red); }
.repo-count {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: .08em;
}
.repo-badge {
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 2px 8px;
}
.repo-tag {
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-secondary);
  letter-spacing: .02em;
  margin-bottom: 32px;
}

/* chapter groups */
.group { margin-bottom: 32px; }
.group-label {
  font-size: 11px;
  letter-spacing: .14em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 2px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-mid);
}

/* chapter row */
.ch {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  transition: border-color .15s;
}
.ch:last-child { border-bottom: none; }
.ch:hover { border-color: var(--border-hover); }

.ch-num {
  font-size: 12px;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
  min-width: 24px;
  flex-shrink: 0;
  letter-spacing: .04em;
}
.ch-link {
  color: var(--text-link);
  font-size: 14px;
  font-family: inherit;
  text-decoration: none;
  transition: color .15s;
  flex-shrink: 0;
  letter-spacing: .03em;
}
.ch-link:hover { color: var(--red); }
.ch-link.planned {
  color: var(--text-faint);
  cursor: default;
  pointer-events: none;
}
.ch-link.outline { color: var(--text-dim); }
.ch-tag {
  font-size: 10px;
  line-height: 16px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-muted);
  border: 1px solid var(--border-mid);
  padding: 0 6px;
  flex-shrink: 0;
  align-self: center;
}
.pill-group-label .ch-tag { margin-left: 10px; }
.ch-desc {
  color: var(--text-dim);
  font-size: 13px;
  flex: 1;
  min-width: 0;
  letter-spacing: .02em;
}

/* metrics pill layout */
.pill-group { margin-bottom: 24px; }
.pill-group-label {
  font-size: 11px;
  letter-spacing: .14em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 0;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-mid);
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 12px 0;
}
.pill {
  font-size: 12px;
  font-family: inherit;
  color: var(--pill-text);
  background: var(--pill-bg);
  border: 1px solid var(--pill-border);
  border-radius: 0;
  padding: 4px 10px;
  letter-spacing: .06em;
  white-space: nowrap;
  transition: color .15s, border-color .15s;
}
a.pill { text-decoration: none; }
.pill:hover { color: var(--red); border-color: var(--red); }
.pill.planned { opacity: .5; cursor: default; }
.pill.planned:hover { color: var(--pill-text); border-color: var(--pill-border); }

/* ── animated particle canvas ── */
#bg-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
  transition: opacity .4s;
}
html[data-theme="light"] #bg-canvas { opacity: 0; }

/* ── theme toggle ── */
#theme-toggle {
  position: fixed;
  top: 16px;
  right: 20px;
  z-index: 10000;
  cursor: pointer;
  display: inline-block;
  width: 44px;
  height: 26px;
}
#theme-toggle input {
  display: none;
}
.toggle-knob {
  display: block;
  width: 44px;
  height: 26px;
  border-radius: 13px;
  background: var(--border-mid);
  position: relative;
  transition: background .3s;
}
.toggle-knob::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--text-secondary);
  transition: transform .3s, background .3s;
  box-shadow: 0 1px 4px rgba(0,0,0,.4);
}
#theme-toggle input:checked ~ .toggle-knob {
  background: var(--red-dim);
}
#theme-toggle input:checked ~ .toggle-knob::after {
  transform: translateX(18px);
  background: var(--accent);
}

/* ── mobile responsive ── */
@media (max-width: 640px) {
  body { padding: 28px 14px 60px; }
  .panel { padding: 20px 16px; }
  .hdr { margin-bottom: 32px; }
  .hdr-name { font-size: 20px; letter-spacing: .08em; }
  .hdr-sub {
    font-size: 11px;
    letter-spacing: .08em;
    line-height: 2;
  }
  .seg { gap: 10px; }
  .seg-row { grid-template-columns: 1fr; }
  .seg-items { gap: 0 18px; }
  .seg-item { font-size: 11px; }
  .ch {
    flex-wrap: wrap;
    gap: 4px 8px;
    align-items: flex-start;
  }
  .ch-desc {
    flex-basis: 100%;
    padding-left: 32px;
    font-size: 12px;
  }
  .ch-link { font-size: 13px; }
  .ch-num { min-width: 24px; }
  .repo-meta { flex-wrap: wrap; gap: 8px; }
}
</style>
</head>

const SITE = 'https://karam-nus.github.io/';
const GH   = 'https://github.com/karam-nus/';
const byId = Object.fromEntries(repos.map(r => [r.id, r]));

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function extLink(cls, href, text) {
  const a = el('a', cls, text);
  a.href = href; a.target = '_blank'; a.rel = 'noopener';
  return a;
}
function isOutline(r, g, ch) { return !!(r.draft || g.o || ch.o); }

/* counts are derived from the data so they can never go stale */
function stats(r) {
  const s = { live:0, outline:0, planned:0, text:'' };
  if (r.pillGroups) {
    let domains = 0;
    r.pillGroups.forEach(g => {
      if (g.dir) { s.live += g.pills.length; domains++; } else s.planned += g.pills.length;
    });
    s.text = s.live + ' metrics · ' + domains + ' domains';
  } else {
    let main = 0, app = 0;
    r.groups.forEach(g => g.chs.forEach(ch => {
      if (/^\d+$/.test(ch.n)) main++; else if (/^[A-Z]$/.test(ch.n)) app++;
      if (!ch.u) s.planned++; else if (isOutline(r, g, ch)) s.outline++; else s.live++;
    }));
    s.text = r.unit ? main + ' ' + r.unit : main + ' ch';
    if (app) s.text += ' + ' + app + (app === 1 ? ' appendix' : ' appendices');
  }
  if (s.planned) s.text += ' · ' + s.planned + ' planned';
  if (s.outline && !r.draft) s.text += ' · ' + s.outline + ' in outline';
  return s;
}

/* ── summary line ── */
const totals = repos.map(stats).reduce((a, s) => ({
  live: a.live + s.live, outline: a.outline + s.outline }), { live:0, outline:0 });
document.getElementById('seg-label').textContent =
  'Knowledge Base · ' + repos.length + ' guides · ' +
  totals.live + ' pages written · ' + totals.outline + ' in outline';

/* ── build tab grid (one row per category) ── */
const seg = document.getElementById('seg');
cats.forEach(c => {
  const row = el('div', 'seg-row');
  row.appendChild(el('div', 'seg-cat', c.name));
  const items = el('div', 'seg-items');
  c.ids.forEach(id => {
    const r = byId[id];
    const btn = el('button', 'seg-item' + (r.draft ? ' draft' : ''), r.label);
    btn.type = 'button';
    btn.dataset.id = id;
    if (r.draft) btn.title = 'Outline draft — chapters being written';
    btn.addEventListener('click', () => activate(id, true));
    items.appendChild(btn);
  });
  row.appendChild(items);
  seg.appendChild(row);
});
const track = el('div', 'seg-track');
seg.appendChild(track);

/* ── build content panels ── */
const contentEl = document.getElementById('content');
cats.flatMap(c => c.ids).forEach(id => {
  const r = byId[id];
  const base = SITE + r.id + '/';
  const st = stats(r);
  const div = el('div', 'content');
  div.id = 'panel-' + r.id;

  // meta bar
  const meta = el('div', 'repo-meta');
  meta.appendChild(extLink('repo-link', base, r.label + ' ↗'));
  meta.appendChild(extLink('repo-link', GH + r.id, 'SOURCE ↗'));
  meta.appendChild(el('span', 'repo-count', st.text));
  if (r.draft) meta.appendChild(el('span', 'repo-badge', 'outline draft'));
  div.appendChild(meta);
  if (r.tag) div.appendChild(el('p', 'repo-tag', r.tag));

  if (r.pillGroups) {
    r.pillGroups.forEach(g => {
      const pg = el('div', 'pill-group');
      const lbl = el('div', 'pill-group-label', g.name);
      if (!g.dir) lbl.appendChild(el('span', 'ch-tag', 'planned'));
      pg.appendChild(lbl);
      const pills = el('div', 'pills');
      g.pills.forEach(([label, slug]) => {
        pills.appendChild(g.dir
          ? extLink('pill', base + 'docs/metrics/' + g.dir + '/' + slug, label)
          : el('span', 'pill planned', label));
      });
      pg.appendChild(pills);
      div.appendChild(pg);
    });
  } else {
    r.groups.forEach(g => {
      const grpDiv = el('div', 'group');
      if (g.name) grpDiv.appendChild(el('div', 'group-label', g.name));
      g.chs.forEach(ch => {
        const row = el('div', 'ch');
        row.appendChild(el('span', 'ch-num', ch.n));
        const outline = isOutline(r, g, ch);
        if (ch.u) {
          row.appendChild(extLink('ch-link' + (outline ? ' outline' : ''), base + ch.u, ch.t));
          if (outline && !r.draft) row.appendChild(el('span', 'ch-tag', 'outline'));
        } else {
          row.appendChild(el('span', 'ch-link planned', ch.t));
          row.appendChild(el('span', 'ch-tag', 'planned'));
        }
        if (ch.d) row.appendChild(el('span', 'ch-desc', '· ' + ch.d));
        grpDiv.appendChild(row);
      });
      div.appendChild(grpDiv);
    });
  }
  contentEl.appendChild(div);
});

/* ── tab switching (deep-linkable: karam-nus.github.io/#quantization) ── */
function moveTrack() {
  const active = seg.querySelector('.seg-item.active');
  if (!active) return;
  track.style.left  = active.offsetLeft + 'px';
  track.style.top   = (active.offsetTop + active.offsetHeight) + 'px';
  track.style.width = active.offsetWidth + 'px';
}
function activate(id, updateHash) {
  if (!byId[id]) return;
  seg.querySelectorAll('.seg-item').forEach(b =>
    b.classList.toggle('active', b.dataset.id === id)
  );
  document.querySelectorAll('.content').forEach(c =>
    c.classList.toggle('active', c.id === 'panel-' + id)
  );
  moveTrack();
  if (updateHash) history.replaceState(null, '', '#' + id);
}
const initialId = location.hash.slice(1);
activate(byId[initialId] ? initialId : cats[0].ids[0], false);
window.addEventListener('hashchange', () => activate(location.hash.slice(1), false));
window.addEventListener('load',   () => setTimeout(moveTrack, 40));
window.addEventListener('resize', moveTrack);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveTrack);

/* ── theme toggle ── */
(function () {
  const input = document.getElementById('theme-toggle-input');
  const html  = document.documentElement;
  function applyTheme(theme) {
    if (theme === 'light') {
      html.dataset.theme = 'light';
      input.checked = true;
    } else {
      delete html.dataset.theme;
      input.checked = false;
    }
  }
  applyTheme(localStorage.getItem('theme') || 'dark');
  input.addEventListener('change', function () {
    const next = this.checked ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  });
}());
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js" integrity="sha384-OLBgp1GsljhM2TJ+sbHjaiH9txEUvgdDTAzHv2P24donTt6/529l+9Ua0vFImLlb" crossorigin="anonymous"></script>
<script>
/* ── emergent particle background (adapted from ai-timeline.org) ── */
(function () {
  var canvas = document.getElementById('bg-canvas');
  if (!canvas || typeof THREE === 'undefined') return;

  var W = window.innerWidth, H = window.innerHeight;
  var scene    = new THREE.Scene();
  var camera   = new THREE.PerspectiveCamera(75, W / H, 0.1, 2000);
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  } catch (e) {
    return; /* WebGL unavailable */
  }
  renderer.setClearColor(0x000000, 0); /* transparent background */
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  /* Keep in sync with CSS @media (max-width: 640px). Particle count is fixed at
     init time; a resize across this threshold won't change density, but that
     edge case is acceptable without a full scene reinit. */
  var MOBILE_BREAKPOINT     = 640;
  var RESIZE_DEBOUNCE_MS    = 150;
  var isMobile = W < MOBILE_BREAKPOINT;
  var CFG = {
    layers:            5,
    particlesPerLayer: isMobile ? 350 : 700,
    /* particle colors are WebGL linear-color values for the additive-blending
       glow effect; they intentionally differ from the CSS palette */
    baseColor:         new THREE.Color(0.2, 0.3, 0.8),
    baseSize:          isMobile ? 1.2 : 1.5,
    baseOpacity:       0.4,
    rotationSpeed:     0.05,
    waveSpeed:         0.0008,
    cameraDistance:    300,
  };

  var layers = [];
  for (var li = 0; li < CFG.layers; li++) {
    (function (layerIndex) {
      var geo  = new THREE.BufferGeometry();
      var pos  = new Float32Array(CFG.particlesPerLayer * 3);
      for (var i = 0; i < CFG.particlesPerLayer * 3; i += 3) {
        var angle  = (i / 3) * 0.1;
        var radius = (layerIndex + 1) * 50 + Math.sin(angle) * 20;
        pos[i]     = Math.cos(angle) * radius;
        pos[i + 1] = Math.sin(angle) * radius;
        pos[i + 2] = layerIndex * 20 - 50;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

      var mat = new THREE.PointsMaterial({
        size:     CFG.baseSize,
        color:    new THREE.Color(
          CFG.baseColor.r + layerIndex * 0.15,
          CFG.baseColor.g + layerIndex * 0.02,
          CFG.baseColor.b - layerIndex * 0.15
        ),
        transparent: true,
        opacity:     CFG.baseOpacity - layerIndex * 0.05,
        blending:    THREE.AdditiveBlending,
        depthWrite:  false,
        depthTest:   false,
      });

      var pts = new THREE.Points(geo, mat);
      scene.add(pts);
      layers.push({ pts: pts, geo: geo });
    })(li);
  }

  camera.position.z = CFG.cameraDistance;
  camera.position.y = -50;

  var time    = 0;
  var targetY = -50;

  window.addEventListener('scroll', function () {
    var max = document.body.scrollHeight - window.innerHeight;
    if (max > 0) targetY = -100 + (window.scrollY / max) * 200;
  }, { passive: true });

  function animate() {
    requestAnimationFrame(animate);
    time += CFG.waveSpeed;

    for (var li = 0; li < layers.length; li++) {
      var layer = layers[li];
      var pos   = layer.pts.geometry.attributes.position.array;
      for (var i = 0; i < pos.length; i += 3) {
        var ang = (i / 3) * 0.1 + time;
        var r   = (li + 1) * 50 + Math.sin(ang + li) * 15;
        pos[i]     = Math.cos(ang) * r + Math.sin(time * 1.5 + i) * 3;
        pos[i + 1] = Math.sin(ang) * r + Math.cos(time * 1.5 + i) * 3;
        pos[i + 2] += Math.sin(time + i * 0.01) * 0.1;
      }
      layer.pts.geometry.attributes.position.needsUpdate = true;
      layer.pts.rotation.z = time * CFG.rotationSpeed;
    }

    camera.position.x += (Math.sin(time * 0.5) * 30 - camera.position.x) * 0.05;
    camera.position.y += (targetY - camera.position.y) * 0.15;
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
  }

  animate();

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      W = window.innerWidth; H = window.innerHeight;
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }, RESIZE_DEBOUNCE_MS);
  });
}());
</script>
